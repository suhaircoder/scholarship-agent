# Each source must be a feed the publisher already offers for readers.
# If a feed starts returning 403 or 404, disable it. Do not route around the block.
sources:
  - id: euraxess
    type: rss
    enabled: true
    url: https://euraxess.ec.europa.eu/job-feed
    description: Newest European Commission research jobs.

  - id: euraxess_pages
    type: euraxess_search
    enabled: true
    url: https://euraxess.ec.europa.eu/jobs/search
    pages: 30
    description: The public EURAXESS search, thirty pages of open research positions.

